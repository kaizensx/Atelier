name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          swift --version
      # Native build only: the hosted runners' Swift 6.3 compiler crashes on the two-architecture
      # (xcbuild) path. Universal release builds are made on the maintainer's Mac by build.sh.
      - name: Build
        run: swift build
      - name: Test
        run: swift test
